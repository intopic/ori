[package]
name = "ori-prover"
version = "0.1.0"
edition = "2021"
description = "Provues Groth16 në Rust për qarqet circom të CIP-MPT"
publish = false

[dependencies]
ark-bn254 = "0.6"
ark-circom = { version = "0.6", default-features = false }
ark-ff = "0.6"
ark-groth16 = { version = "0.6", features = ["parallel"] }
getrandom = "0.2"
num-bigint = "0.4"
serde_json = "1"
